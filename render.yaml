services:
  # 1. Backend Web Service (Spring Boot 3 + Aiven PostgreSQL via Docker)
  - type: web
    name: springaimcp-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://pg-2ff57b18-alagesan-0eb8.b.aivencloud.com:15331/templeinfo?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_R2DBC_URL
        value: r2dbc:postgresql://pg-2ff57b18-alagesan-0eb8.b.aivencloud.com:15331/templeinfo?sslmode=require
      - key: SPRING_R2DBC_USERNAME
        value: avnadmin
      - key: SPRING_R2DBC_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend Static Site (Vite React 18 -> https://springaimcp-frontend.onrender.com)
  - type: web
    name: springaimcp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://springaimcp-backend.onrender.com
