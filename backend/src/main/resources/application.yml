server:
  port: ${PORT:8080}

spring:
  profiles:
    default: local
  main:
    allow-bean-definition-overriding: true
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${SPRING_DATASOURCE_PASSWORD:}
  r2dbc:
    password: ${SPRING_R2DBC_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  ai:
    mcp:
      server:
        name: springaimcp-server
        version: 1.0.0
        transport: sse
        port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

temple:
  translation:
    gemini-api-key: ${GEMINI_API_KEY:}

jwt:
  secret: ${JWT_SECRET:c3ByaW5nYWltY3Atc2VjcmV0LWtleS0yNTYtYml0cy1sb25nLWZvci1qd3QtYXV0aC1zZWN1cml0eQ==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
